<!doctype html>

<style>

--r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px; --r-pill: 999px;

--overlay: rgba(0, 0, 0, .6);
--skeleton: #262B31;

--row-active: #1C2A31;
--border: #272B31;
--border-input: #6C7480;
--text: #ECEDEF;

--shadow-pop: 0 16px 40px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .04);
--av1-bg: #214556; --av1-fg: #BFE3F2;
--av2-bg: #4A3A1C; --av2-fg: #EAD5AA;
--av3-bg: #2F4120; --av3-fg: #CCE5B3;
--av4-bg: #47283F; --av4-fg: #EBC9E2;
--av5-bg: #2D3158; --av5-fg: #CBCFF5;
--av6-bg: #512A22; --av6-fg: #F2CABF;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
.pl-root{font-family:var(--font-ui);font-size:var(--fs-base);line-height:var(--lh-base);color:var(--text);-webkit-font-smoothing:antialiased}
.pl-root button{appearance:none;-webkit-appearance:none;border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit}
.pl-root input{font:inherit;color:inherit;margin:0}
.pl-root input::placeholder{color:var(--text-3);opacity:1}
.pl-root :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pl-root input:focus-visible{outline:none}
.pl-field:focus-within{border-color:var(--accent) !important;box-shadow:0 0 0 3px var(--focus-ring)}
.pl-spin{animation:pl-spin 1s linear infinite}
@keyframes pl-spin{to{transform:rotate(360deg)}}
.pl-pulse{animation:pl-pulse 1.6s ease-in-out infinite}
@keyframes pl-pulse{50%{opacity:.55}}
.pl-scroll{overflow:auto;scrollbar-width:thin}
@media (max-width:760px){.pl-list{width:100% !important;border-right:0 !important}.pl-detail,.pl-panel,.pl-deco{display:none !important}}
</style>

</head>
<body>

<div class="pl-root pl-dark" style="width:100%;height:100vh;display:flex;background:var(--surface);overflow:hidden"><div style="flex:1;min-width:0;display:flex;flex-direction:column;padding:32px 64px"><div style="flex:none"><div style="display:flex;align-items:center;gap:10px"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true" style="flex:none;display:block"><path d="M16 3C8.8 3 3 8.3 3 15c0 3.2 1.4 6.1 3.7 8.2L5.5 28.5l5.4-2.4c1.6.5 3.3.8 5.1.8 7.2 0 13-5.3 13-12S23.2 3 16 3z" fill="var(--accent)"></path><circle cx="16" cy="15" r="3.4" fill="var(--accent-fg)"></circle></svg><span style="font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1;letter-spacing:-.02em;color:var(--text)">plover</span></div></div><div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center"><div style="width:100%;max-width:400px;display:flex;flex-direction:column;gap:24px"><div style="display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--sunken)"><button type="button" aria-pressed="false" style="flex:1;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:20px;background:transparent;color:var(--text-2);font-weight:500;">Sign in</button><button type="button" aria-pressed="true" style="flex:1;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:20px;background:var(--surface);color:var(--text);box-shadow:var(--shadow-1);font-weight:600;">Create account</button></div><div style="display:flex;flex-direction:column;gap:6px"><h1 style="margin:0;font-family:var(--font-display);font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.01em">Create your account</h1><p style="margin:0;font-size:15px;line-height:22px;color:var(--text-2)">Pick a username so people can find you.</p></div><div style="display:flex;flex-direction:column;gap:16px"><div style="display:flex;flex-direction:column;gap:6px"><label for="reg-name" style="font-size:13px;line-height:18px;font-weight:500;color:var(--text-2)">Display name</label><div class="pl-field" style="height:48px;display:flex;align-items:center;gap:6px;padding:0 4px 0 14px;border:1px solid var(--border-input);border-radius:12px;background:var(--surface)"><input id="reg-name" type="text" value="Sam Rivera" placeholder="" style="flex:1;min-width:0;height:44px;border:0;background:transparent;outline:none;font-size:15px"></div></div><div style="display:flex;flex-direction:column;gap:6px"><label for="reg-user" style="font-size:13px;line-height:18px;font-weight:500;color:var(--text-2)">Username</label><div class="pl-field" style="height:48px;display:flex;align-items:center;gap:6px;padding:0 4px 0 14px;border:1px solid var(--danger);border-radius:12px;background:var(--surface)"><span style="font-size:15px;color:var(--text-3);margin-right:-4px">@</span><input id="reg-user" type="text" value="sam" placeholder="" style="flex:1;min-width:0;height:44px;border:0;background:transparent;outline:none;font-size:15px"></div><div style="display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:var(--danger)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;display:block"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.8v5"></path><path d="M12 16.2h.01" stroke-width="2.4"></path></svg><span>That username is taken. Try sam.rivera.</span></div></div><div style="display:flex;flex-direction:column;gap:6px"><label for="reg-email" style="font-size:13px;line-height:18px;font-weight:500;color:var(--text-2)">Email</label><div class="pl-field" style="height:48px;display:flex;align-items:center;gap:6px;padding:0 4px 0 14px;border:1px solid var(--border-input);border-radius:12px;background:var(--surface)"><input id="reg-email" type="email" value="sam@example.com" placeholder="" style="flex:1;min-width:0;height:44px;border:0;background:transparent;outline:none;font-size:15px"></div></div><div style="display:flex;flex-direction:column;gap:6px"><label for="reg-pw" style="font-size:13px;line-height:18px;font-weight:500;color:var(--text-2)">Password</label><div class="pl-field" style="height:48px;display:flex;align-items:center;gap:6px;padding:0 4px 0 14px;border:1px solid var(--border-input);border-radius:12px;background:var(--surface)"><input id="reg-pw" type="password" value="a-long-passphrase" placeholder="" style="flex:1;min-width:0;height:44px;border:0;background:transparent;outline:none;font-size:15px"><button type="button" aria-label="Show password" style="width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:10px;background:transparent;color:var(--text-2);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;display:block"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"></path><circle cx="12" cy="12" r="2.8"></circle></svg></button></div><div style="font-size:13px;line-height:18px;color:var(--text-3)">Use at least 10 characters.</div></div><button type="button" style="height:48px;padding:0 18px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;line-height:20px;font-weight:600;white-space:nowrap;width:100%;background:var(--accent);color:var(--accent-fg);">Create account</button></div><p style="margin:0;font-size:13px;line-height:18px;color:var(--text-3)">By creating an account you agree to the <a href="#" style="color:var(--accent);font-weight:600;text-decoration:none">Terms</a> and <a href="#" style="color:var(--accent);font-weight:600;text-decoration:none">Privacy Policy</a>.</p></div></div><div style="flex:none;display:flex;gap:20px;font-size:13px;line-height:18px;color:var(--text-3)"><span>Plover</span><a href="#" style="color:var(--text-3)">Privacy</a><a href="#" style="color:var(--text-3)">Terms</a></div></div><div class="pl-deco" style="width:42%;flex:none;position:relative;overflow:hidden;background:var(--accent-soft)"><svg class="pl-deco" width="100%" height="100%" viewBox="0 0 560 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position:absolute;top:0;left:0;display:block"><rect x="70" y="150" width="300" height="88" rx="26" fill="var(--surface)"></rect><rect x="96" y="176" width="200" height="10" rx="5" fill="var(--border)" opacity="1"></rect><rect x="96" y="198" width="130" height="10" rx="5" fill="var(--border)" opacity="1"></rect><rect x="190" y="262" width="300" height="66" rx="26" fill="var(--accent)"></rect><rect x="216" y="288" width="190" height="10" rx="5" fill="var(--accent-fg)" opacity="0.85"></rect><rect x="70" y="352" width="360" height="112" rx="26" fill="var(--surface)"></rect><rect x="96" y="378" width="270" height="10" rx="5" fill="var(--border)" opacity="1"></rect><rect x="96" y="400" width="300" height="10" rx="5" fill="var(--border)" opacity="1"></rect><rect x="96" y="422" width="160" height="10" rx="5" fill="var(--border)" opacity="1"></rect><rect x="330" y="446" width="76" height="32" rx="16" fill="var(--bg-app)" stroke="var(--border)"></rect><circle cx="352" cy="462" r="7" fill="var(--accent)"></circle><rect x="366" y="458" width="28" height="8" rx="4" fill="var(--text-3)" opacity=".5"></rect><rect x="250" y="502" width="250" height="66" rx="26" fill="var(--accent)"></rect><rect x="276" y="528" width="150" height="10" rx="5" fill="var(--accent-fg)" opacity="0.85"></rect><rect x="70" y="592" width="230" height="66" rx="26" fill="var(--surface)"></rect><rect x="96" y="618" width="150" height="10" rx="5" fill="var(--border)" opacity="1"></rect></svg></div></div>

</body>
