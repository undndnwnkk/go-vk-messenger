<style>
:root {

--font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
--fs-xs: 12px;  --lh-xs: 16px;
--fs-sm: 13px;  --lh-sm: 18px;
--fs-base: 14px; --lh-base: 20px;
--fs-md: 15px;  --lh-md: 22px;
--fs-lg: 17px;  --lh-lg: 24px;
--fs-xl: 20px;  --lh-xl: 28px;
--fs-2xl: 28px; --lh-2xl: 34px;
--fs-3xl: 40px; --lh-3xl: 44px;
--fw-regular: 400; --fw-medium: 500; --fw-semibold: 600;
--sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;

--avatar-xs: 24px; --avatar-sm: 32px; --avatar-md: 40px; --avatar-lg: 48px; --avatar-xl: 96px;

}

.pl-dark {

--skeleton: #262B31;
--row-hover: #1B1F23;

--border: #272B31;
--border-input: #6C7480;
--text: #ECEDEF;

--text-3: #949AA4;

--quote-out: #1A3B49;

--on-hl: #FFEFB8;
--hl-current: #E2B13C;

--av2-bg: #4A3A1C; --av2-fg: #EAD5AA;
--av3-bg: #2F4120; --av3-fg: #CCE5B3;

*,*::before,*::after{box-sizing:border-box}
body{margin:0}
.pl-root{font-family:var(--font-ui);font-size:var(--fs-base);line-height:var(--lh-base);color:var(--text);-webkit-font-smoothing:antialiased}
.pl-root button{appearance:none;-webkit-appearance:none;border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit}
.pl-root input{font:inherit;color:inherit;margin:0}
.pl-root input::placeholder{color:var(--text-3);opacity:1}
.pl-root :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pl-root input:focus-visible{outline:none}
.pl-field:focus-within{border-color:var(--accent) !important;box-shadow:0 0 0 3px var(--focus-ring)}
.pl-spin{animation:pl-spin 1s linear infinite}
@keyframes pl-spin{to{transform:rotate(360deg)}}
.pl-pulse{animation:pl-pulse 1.6s ease-in-out infinite}
@keyframes pl-pulse{50%{opacity:.55}}
.pl-scroll{overflow:auto;scrollbar-width:thin}
@media (max-width:760px){.pl-list{width:100% !important;border-right:0 !important}.pl-detail,.pl-panel,.pl-deco{display:none !important}}
</style>

</head>

ont-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.02em">PN</div><div style="flex:1;min-width:0"><div style="font-size:15px;line-height:20px;font-weight:500">Priya Nair</div><div style="font-size:13px;line-height:18px;color:var(--text-3)">@priya</div></div><input type="checkbox" aria-label="Select Priya Nair" style="width:20px;height:20px;margin:0;flex:none;accent-color:var(--accent)"></label><label style="width:100%;height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;background:transparent;cursor:pointer"><div aria-hidden="true" style="width:40px;height:40px;flex:none;border-radius:50%;background:var(--av2-bg);color:var(--av2-fg);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.02em">TF</div><div style="flex:1;min-width:0"><div style="font-size:15px;line-height:20px;font-weight:500">Tom Fischer</div><div style="font-size:13px;line-height:18px;color:var(--text-3)">@tom</div></div><input type="checkbox" aria-label="Select Tom Fischer" style="width:20px;height:20px;margin:0;flex:none;accent-color:var(--accent)"></label></div><div style="flex:none;padding:12px 16px 20px;border-top:1px solid var(--border);background:var(--surface)"><button type="button" style="height:48px;padding:0 18px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;line-height:20px;font-weight:600;white-space:nowrap;width:100%;background:var(--accent);color:var(--accent-fg);">Create group · 2</button></div></div>
