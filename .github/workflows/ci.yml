name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: messenger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d messenger_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/messenger_test?sslmode=disable
      JWT_SECRET: ci-secret
      JWT_TTL: 15m

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod and go.sum
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Unit tests
        run: go test ./...

      - name: Repository integration tests
        run: go test ./internal/repository/...

      - name: Race tests
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Two-replica smoke test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: messenger_test
          REDIS_URL: redis://localhost:6379/0
          TEST_APP_A_URL: http://localhost:8080
          TEST_APP_B_URL: http://localhost:8081
        run: |
          go run ./cmd/migrate
          go build -o /tmp/messenger ./cmd/app
          HTTP_PORT=8080 METRICS_ADDR=127.0.0.1:9100 /tmp/messenger > /tmp/app-a.log 2>&1 &
          pid_a=$!
          HTTP_PORT=8081 METRICS_ADDR=127.0.0.1:9101 /tmp/messenger > /tmp/app-b.log 2>&1 &
          pid_b=$!
          trap 'kill "$pid_a" "$pid_b" 2>/dev/null || true' EXIT
          for url in "$TEST_APP_A_URL" "$TEST_APP_B_URL"; do
            for attempt in $(seq 1 30); do
              curl --fail --silent "$url/ready" && break
              sleep 1
            done
            curl --fail --silent "$url/ready"
          done
          go test -race ./tests/infrastructure -count=1 -v
